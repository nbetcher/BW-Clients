# Builds the desktop app for Windows x64 only, for sideloading onto a personal machine.
#
# The Windows passkey plugin authenticator only registers when the app runs from an installed
# Appx package, and Windows only installs signed packages. This fork has no access to Bitwarden's
# signing secrets, so each run generates a throwaway self-signed certificate, signs the binaries
# and the Appx with it, and uploads its public half. Import the uploaded .cer into
# "Local Machine > Trusted People" before installing the Appx. The private key never leaves the
# runner.

name: Build Desktop (Windows x64)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        type: choice
        options:
          - oss
          - bit
        default: oss

defaults:
  run:
    shell: pwsh

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 Build [${{ inputs.variant }}]
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/desktop
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      # The Appx manifest publisher must match the signing certificate subject.
      _APPX_PUBLISHER: CN=BitwardenSideload
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Node version
        id: node-version
        working-directory: ./
        run: |
          $version = (Get-Content .nvmrc).Trim().TrimStart("v")
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: |
            apps/desktop/desktop_native -> target
          cache-targets: "true"

      - name: Print environment
        run: |
          node --version
          npm --version
          cargo --version

      - name: Install Node dependencies
        working-directory: ./
        run: npm ci

      - name: Build native modules
        working-directory: apps/desktop/desktop_native
        run: node build.js --target=x86_64-pc-windows-msvc --release

      - name: Build
        run: npm run build:${{ inputs.variant }}

      - name: Add signtool to PATH
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) {
            Write-Error "signtool.exe not found in the Windows SDK"
            exit 1
          }
          Write-Host "Using $($signtool.FullName)"
          $signtool.DirectoryName >> $env:GITHUB_PATH

      - name: Create sideload signing certificate
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:_APPX_PUBLISHER `
            -KeyUsage DigitalSignature -FriendlyName "Bitwarden Sideload" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(1) `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

          $password = [guid]::NewGuid().ToString()
          Write-Host "::add-mask::$password"
          $pfxPath = Join-Path $env:RUNNER_TEMP "sideload.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath `
            -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null

          New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "cert") | Out-Null
          Export-Certificate -Cert $cert -Type CERT `
            -FilePath (Join-Path $env:RUNNER_TEMP "cert\BitwardenSideload.cer") | Out-Null

          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"
          "ELECTRON_BUILDER_SIGN_CERT=$pfxPath" >> $env:GITHUB_ENV
          "ELECTRON_BUILDER_SIGN_CERT_PW=$password" >> $env:GITHUB_ENV

      # sign.js signs the exe, dll, node and Appx files with the certificate above.
      - name: Pack & sign
        run: |
          npm run clean:dist
          npx electron-builder --win appx portable --x64 -p never "-c.appx.publisher=$env:_APPX_PUBLISHER"
          Copy-Item (Join-Path $env:RUNNER_TEMP "cert\BitwardenSideload.cer") ./dist/

      - name: Remove signing certificate
        if: always()
        run: |
          Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Subject -eq $env:_APPX_PUBLISHER } |
            Remove-Item
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "sideload.pfx")

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Bitwarden-${{ inputs.variant }}-windows-x64
          path: |
            apps/desktop/dist/*.appx
            apps/desktop/dist/Bitwarden-Portable-*.exe
            apps/desktop/dist/BitwardenSideload.cer
          if-no-files-found: error
